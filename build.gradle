        'com/jesz/createdieselgenerators/content/tools/OilScannerItem.class',
        'com/jesz/createdieselgenerators/content/track_layers_bag/TrackLayersBagItem.class',
        'com/jesz/createdieselgenerators/content/track_layers_bag/TrackLayersBagPlacement.class',
        'com/jesz/createdieselgenerators/content/andesite_girder/AndesiteGirderWrenchBehaviour.class',
        'com/jesz/createdieselgenerators/contraption/PumpjackHeadMovementBehaviour.class',
        'com/jesz/createdieselgenerators/content/diesel_engine/huge/HugeDieselEngineBlockEntity.class',
        'com/jesz/createdieselgenerators/content/distillation/DistillationTankBlockEntity.class',
        'com/jesz/createdieselgenerators/compat/strut_your_stuff/StrutYourStuffRegistryEntries.class'
]

tasks.register('auditDedicatedServerClasses') {
    dependsOn tasks.named('compileJava')
    doLast {
        dedicatedServerClasses.each { String relativePath ->
            File classFile = sourceSets.main.output.classesDirs.files
                    .collect { new File(it, relativePath) }
                    .find { it.isFile() }
            if (classFile == null)
                throw new GradleException("Dedicated-server audit could not find ${relativePath}")

            String constantPool = new String(java.nio.file.Files.readAllBytes(classFile.toPath()),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            if (constantPool.contains('net/minecraft/client/') ||
                    constantPool.contains('net/neoforged/neoforge/client/'))
                throw new GradleException("Client-only reference leaked into common class ${relativePath}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('auditDedicatedServerClasses')
}

// Minecraft 26.2 resolves BlockItem names through item.<namespace>.<path>.
// Mirror existing block translations into missing item keys in every language.
def adaptedProcessedAssetsDirectory = layout.buildDirectory.dir("resources/main/assets")
tasks.named("processResources").configure {
    doLast {
        File assetsDirectory = adaptedProcessedAssetsDirectory.get().asFile
        if (!assetsDirectory.isDirectory())
            return

        assetsDirectory.eachFileRecurse(groovy.io.FileType.FILES) { File languageFile ->
            if (languageFile.parentFile.name != "lang" || !languageFile.name.endsWith(".json"))
                return

            Map<String, Object> translations = (Map<String, Object>) new groovy.json.JsonSlurper().parse(languageFile, "UTF-8")
            Map<String, Object> aliases = new LinkedHashMap<>()

            translations.each { String key, Object value ->
                def matcher = key =~ /^block\.([^.]+)\.(.+)$/
                if (matcher.matches()) {
                    String itemKey = "item.${matcher.group(1)}.${matcher.group(2)}"
                    if (!translations.containsKey(itemKey))
                        aliases.put(itemKey, value)
                }
            }

            if (!aliases.isEmpty()) {
                translations.putAll(aliases)
                languageFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(translations)) + System.lineSeparator(), "UTF-8")
            }
        }
    }
}

