plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

def createAdaptedJar = file(providers.gradleProperty('create_adapted_jar').get())
def createAdaptedPonderJar = file(providers.gradleProperty('create_adapted_ponder_jar').get())
def createAdaptedCatnipJar = file(providers.gradleProperty('create_adapted_catnip_jar').get())
def createAdaptedFlywheelJar = file(providers.gradleProperty('create_adapted_flywheel_jar').get())
def createAdaptedCompatibilityJar = file('../build/libs/create-adapted-compile-compat.jar')
def extractedRegistrateJar = layout.buildDirectory.file('local-dependencies/registrate-adapted.jar')

def verifyCreateAdaptedDependencies = tasks.register('verifyCreateAdaptedDependencies') {
    inputs.files(createAdaptedJar, createAdaptedPonderJar, createAdaptedCatnipJar, createAdaptedFlywheelJar,
            createAdaptedCompatibilityJar)
    doLast {
        [createAdaptedJar, createAdaptedPonderJar, createAdaptedCatnipJar, createAdaptedFlywheelJar,
         createAdaptedCompatibilityJar].each { dependency ->
            if (!dependency.isFile())
                throw new GradleException("Missing Create: Adapted dependency: ${dependency}")
        }
    }
}

def sanitizeCreateAdaptedRuntime = tasks.register('sanitizeCreateAdaptedRuntime', Zip) {
    dependsOn(verifyCreateAdaptedDependencies)
    archiveFileName = 'create-adapted-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('local-dependencies')
    from(zipTree(createAdaptedJar)) {
        exclude 'net/neoforged/neoforge/client/model/generators/**'
    }
}

// This task shares build/local-dependencies with the compile compatibility JAR.
// Copy must be used here: Sync deletes sibling outputs and made compilation depend
// on task execution order after upgrading the Create dependency.
def extractCreateAdaptedLibraries = tasks.register('extractCreateAdaptedLibraries', Copy) {
    dependsOn(verifyCreateAdaptedDependencies)
    from(zipTree(createAdaptedJar)) {
        include 'META-INF/jarjar/Registrate-*.jar'
        eachFile { details -> details.path = 'registrate-adapted.jar' }
        includeEmptyDirs = false
    }
    into(extractedRegistrateJar.get().asFile.parentFile)
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Runtime ships the already-generated JSON/model resources. The legacy
// Registrate generators target the old 1.21.1 datagen API and are not needed
// to load or play the adapted mod.
sourceSets.main.java.exclude 'com/jesz/createdieselgenerators/content/andesite_girder/AndesiteGirderGenerator.java'
sourceSets.main.java.exclude 'com/jesz/createdieselgenerators/content/diesel_engine/modular/ModularDieselEngineGenerator.java'
sourceSets.main.java.exclude 'com/jesz/createdieselgenerators/content/pumpjack/PumpjackHoleGenerator.java'
sourceSets.main.java.exclude 'com/jesz/createdieselgenerators/events/datagen/**'

neoForge {

    version = project.neo_version

    if (project.parchment_mappings_version != 'none') {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Minecraft 26.2 resolves inventory models through assets/<namespace>/items.
// The original 1.21.1 datagen only produced models/item, so bridge every
// existing item model to the new item-definition format during the build.
def generatedItemDefinitions = layout.buildDirectory.dir('generated/item-definitions')
def generateItemDefinitions = tasks.register('generateItemDefinitions') {
    def itemModelDirs = [
            file('src/main/resources/assets/createdieselgenerators/models/item'),
            file('src/generated/resources/assets/createdieselgenerators/models/item')
    ]
    inputs.files(itemModelDirs.collect { fileTree(it) { include '**/*.json' } })
    outputs.dir(generatedItemDefinitions)

    doLast {
        def outputRoot = generatedItemDefinitions.get().asFile
        delete(outputRoot)

        itemModelDirs.findAll { it.isDirectory() }.each { modelDir ->
            fileTree(modelDir).matching { include '**/*.json' }.files.each { modelFile ->
                def relativePath = modelDir.toPath().relativize(modelFile.toPath()).toString().replace('\\', '/')
                def modelId = relativePath.substring(0, relativePath.length() - '.json'.length())
                // Nested and state-specific models are renderer parts, not
                // registered item IDs. Publishing definitions for them puts
                // their sprites on the item atlas and breaks partial models.
                def auxiliaryModels = [
                        'andesite_girder_strut',
                        'lighter_open', 'lighter_ignited',
                        'oil_scanner_none', 'oil_scanner_medium', 'oil_scanner_high',
                        'track_layers_bag_filled', 'wire_cutters_cut'
                ] as Set
                if (relativePath.contains('/') || auxiliaryModels.contains(modelId))
                    return
                def outputFile = new File(outputRoot, "assets/createdieselgenerators/items/${relativePath}")
                outputFile.parentFile.mkdirs()
                outputFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        model: [
                                type : 'minecraft:model',
                                model: "createdieselgenerators:item/${modelId}"
                        ]
                ])) + System.lineSeparator()
            }
        }

        // 26.2 dynamic item renderers obtain their component models from the
        // item-model map. Give renderer parts stable, flat lookup IDs without
        // pretending that they are registered game items.
        def auxiliaryModels = [
                lighter_open: 'lighter_open',
                lighter_ignited: 'lighter_ignited',
                chemical_sprayer_cog: 'chemical_sprayer/cog',
                wire_cutters_cut: 'wire_cutters_cut',
                oil_scanner_none: 'oil_scanner_none',
                oil_scanner_medium: 'oil_scanner_medium',
                oil_scanner_high: 'oil_scanner_high',
                track_layers_bag_filled: 'track_layers_bag_filled',
                mold_bar: 'mold/bar',
                mold_bowl: 'mold/bowl',
                mold_chain: 'mold/chain',
                mold_lines: 'mold/lines'
        ]
        ['arc', 'creeper', 'diamond', 'dragon', 'fire', 'glass', 'heavier',
         'obsidian', 'soul', 'sussy', 'titanium', 'willows'].each { skin ->
            auxiliaryModels["lighter_${skin}"] = "lighter/${skin}"
            auxiliaryModels["lighter_${skin}_open"] = "lighter/${skin}_open"
            auxiliaryModels["lighter_${skin}_ignited"] = "lighter/${skin}_ignited"
        }
        auxiliaryModels.each { definitionId, modelId ->
            def outputFile = new File(outputRoot,
                    "assets/createdieselgenerators/items/${definitionId}.json")
            outputFile.parentFile.mkdirs()
            outputFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    model: [
                            type : 'minecraft:model',
                            model: "createdieselgenerators:item/${modelId}"
                    ]
            ])) + System.lineSeparator()
        }
    }
}

